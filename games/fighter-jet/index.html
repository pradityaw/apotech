<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sky Striker — 1942-style Arcade Shooter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    Layout architecture:
    - #game-wrap is a fixed-size frame that holds the canvas plus all DOM UI
      layered on top of it (HUD bar and the start / game-over overlays).
    - The canvas renders the game world only (jets, bullets, stars, particles).
    - Scores, lives and screens are plain DOM so they stay crisp and need no
      per-frame text rendering.
  -->
  <div id="game-wrap">
    <canvas id="game-canvas" width="480" height="640"></canvas>

    <!-- Heads-up display (visible while playing) -->
    <div id="hud" class="hidden">
      <div class="hud-block">
        <span class="hud-label">SCORE</span>
        <span id="hud-score">0</span>
      </div>
      <div class="hud-block hud-center">
        <span class="hud-label">HI</span>
        <span id="hud-high-score">0</span>
      </div>
      <div class="hud-block hud-right">
        <span class="hud-label">LIVES</span>
        <span id="hud-lives"></span>
      </div>
    </div>

    <!-- Rapid-fire power-up countdown bar -->
    <div id="power-bar-wrap" class="hidden">
      <div id="power-bar"></div>
      <span id="power-bar-label">RAPID FIRE</span>
    </div>

    <!-- Start screen overlay -->
    <div id="start-screen" class="overlay">
      <h1>SKY STRIKER</h1>
      <p class="subtitle">A 1942-style arcade shooter</p>
      <div class="instructions">
        <p><strong>WASD</strong> or <strong>Arrow Keys</strong> — move</p>
        <p><strong>Space</strong> — fire</p>
        <p>Grab <span class="power-text">P</span> power-ups for rapid fire</p>
      </div>
      <button id="start-btn" class="action-btn">START MISSION</button>
      <p class="hint">or press Enter</p>
    </div>

    <!-- Game over overlay -->
    <div id="game-over-screen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p id="new-high-score" class="new-high hidden">NEW HIGH SCORE!</p>
      <p class="final-line">Score <span id="final-score">0</span></p>
      <p class="final-line">Best <span id="best-score">0</span></p>
      <button id="restart-btn" class="action-btn">RESTART</button>
      <p class="hint">or press Enter</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
